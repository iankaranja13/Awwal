services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: awwal
      POSTGRES_PASSWORD: awwal
      POSTGRES_DB: awwal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awwal -d awwal"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://awwal:awwal@db:5432/awwal
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  pgdata:
