# Draft v0.1 screening flags. Every rule is unvalidated and must be confirmed
# by the clinical advisor before any pilot use. Do not treat thresholds,
# routes or option values as clinical guidance.
version: "0.1"
flags:
  - id: LS_TTC_STANDARD
    domain: context
    label:
      en: "Trying to conceive for at least the standard threshold"
      ar: "بلوغ مدة محاولة الحمل الحد المعتمد"
    required_fields: [trying_to_conceive, months_trying]
    present_when:
      all:
        - {field: trying_to_conceive, op: eq, value: "yes"}
        - {field: months_trying, op: gte, param: ttc_threshold_months}
    modifiable: false
    suggests_route: FERTILITY_SERVICES
    is_ttc_criterion: true
    key: true
    snippet_id: SNP_TTC_STANDARD
    source: "TO BE CONFIRMED BY CLINICAL ADVISOR (AUA/ASRM; EAU)"
    requires_clinical_validation: true
    needs_native_review: true
  - id: LS_TTC_EARLIER
    domain: context
    label:
      en: "Trying to conceive for at least the earlier threshold with an older partner"
      ar: "بلوغ مدة محاولة الحمل الحد المبكر المعتمد"
    required_fields: [trying_to_conceive, months_trying, partner_age_band]
    present_when:
      all:
        - {field: trying_to_conceive, op: eq, value: "yes"}
        - {field: months_trying, op: gte, param: ttc_threshold_months_older_partner}
        - {field: partner_age_band, op: eq, param: older_partner_band}
    modifiable: false
    suggests_route: FERTILITY_SERVICES
    is_ttc_criterion: true
    key: false
    snippet_id: SNP_TTC_EARLIER
    source: "TO BE CONFIRMED BY CLINICAL ADVISOR (AUA/ASRM; EAU)"
    requires_clinical_validation: true
    needs_native_review: true
