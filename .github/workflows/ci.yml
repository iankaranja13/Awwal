name: backend-ci

on:
  push:
    branches: ["main", "master", "feature/awwal-backend"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: awwal
          POSTGRES_PASSWORD: awwal
          POSTGRES_DB: awwal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://awwal:awwal@localhost:5432/awwal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: make dev
      - name: Migrate test database
        run: make migrate
      - name: Quality gate
        run: make check
